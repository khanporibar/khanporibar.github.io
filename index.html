@keyframes dtp{0%,100%{transform:scale(1)}50%{transform:scale(1.4);box-shadow:0 0 0 2px rgba(7,11,26,.9),0 0 18px 4px var(--c,#60a5fa)}}
.tk{display:flex;align-items:center;gap:10px;margin:10px 0 4px;padding:7px 12px 7px 8px;border-radius:18px;cursor:pointer;background:linear-gradient(135deg,rgb(var(--gr) / .2),rgb(var(--g2r) / .12));border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 24px -14px rgb(var(--g2r) / .9),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tk.hide{display:none}
.tki{position:relative;flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 0 16px rgb(var(--g2r) / .7)}
.tks{width:19px;height:19px;fill:currentColor;stroke:none;overflow:visible;animation:ring 3s ease-in-out infinite;transform-origin:30% 60%}
.tks .w1,.tks .w2{fill:none;stroke:currentColor;stroke-width:1.800;stroke-linecap:round;animation:wv 1.6s ease-in-out infinite}.tks .w2{animation-delay:.3s}
.tkd{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fb7185;border:2px solid #0b1124;animation:dtp 1.6s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-14deg)}72%{transform:rotate(12deg)}78%{transform:rotate(-8deg)}84%{transform:rotate(5deg)}}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
.tkv{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.tkt{display:inline-block;white-space:nowrap;padding-left:100%;font-size:14px;font-weight:600;color:var(--ink);animation:tkm var(--d,20s) linear infinite}
.tk:active .tkt{animation-play-state:paused}
@keyframes tkm{to{transform:translateX(-100%)}}
.gs{transform-box:fill-box;transform-origin:50% 100%;animation:gsw 2.6s ease-in-out infinite}
@keyframes gsw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.ff{animation:ffl 4s ease-in-out infinite}
@keyframes ffl{0%,100%{opacity:.1;transform:translate(0,0)}35%{opacity:1;transform:translate(9px,-11px)}70%{opacity:.5;transform:translate(-7px,-4px)}}
.bf{animation:bfa 26s ease-in-out infinite alternate}.bf.b2{animation-name:bfb;animation-duration:30s}
.bf .wl,.bf .wr{transform-box:fill-box;animation:flp .32s ease-in-out infinite alternate}
.bf .wl{transform-origin:100% 50%}.bf .wr{transform-origin:0 50%}
@keyframes flp{to{transform:scaleX(.25)}}
